<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立標註任務</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/liff.css') }}?v=4">
</head>

<body>
    
    <main class="container">
        
        <section class="card">
            <h1 id="page-title">建立標註任務</h1>

            <!-- <p>正在確認 LINE 使用者資訊</p> -->

            <div id="profile" style="display:none; margin-top: 20px;">
                <img
                id="profile-image"
                alt="LINE 使用者頭像"
                style="display: none;"
            >
                <p>
                    您好，<strong id="display-name"></strong>
                </p>
            </div>
            <div id="status" class="status">
                登入中......
            </div>
            <form id="task-form" style="display: none; margin-top: 24px;">
                <h2>選擇圖片</h2>
                <p>
                    支援JPG、JPEG、PNG，可以一次選擇多張圖片。
                </p>
                   <label for="image-input" class="upload-button">
                        選擇圖片
                   </label> 
                   <input 
                        id="image-input"
                        type="file"
                        accept="image/jpeg,image/png"
                        multiple
                        hidden 
                   >
                   <p id="image-count">
                        尚未選擇圖片
                   </p>
                   <section id="upload-progress-container" hidden>
                        <progress
                            id="upload-progress"
                            value="0"
                            max="100"
                        ></progress>
                        <p id="upload-progress-text">
                            準備上傳
                        </p>
                   </section>
                   <div class="form-group">
                        <label for="prompt">
                            想要標註的物件
                        </label>
                        <textarea
                            id="prompt"
                            name="prompt"
                            rows="4"
                            maxlength="200"
                            placeholder="例如: 請標註圖片中的貓咪"
                        ></textarea>
                        <p id="prompt-count">
                            0 / 200
                        </p>
                   </div>
                   <button
                        id="submit-button"
                        type="submit"
                        class="submit-button"
                    >
                        建立標註任務
                    </button>
            </form>    
        </section>
    </main>
    <div
        id="upload-success-modal"
        class="success-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="upload-success-title"
        hidden
    >
        <div class="success-modal-card">
            <div class="success-modal-icon" aria-hidden="true">✓</div>
            <h2 id="upload-success-title">圖片上傳成功</h2>
            <p id="upload-success-message"></p>
            <p>
                標註任務會在背景繼續執行，您現在可以安全離開此頁面。
            </p>
            <button
                id="upload-success-close"
                type="button"
                class="submit-button"
            >
                完成並離開
            </button>
            <p id="upload-success-close-help" class="close-help" hidden>
                瀏覽器未允許自動關閉，請手動關閉此分頁。
            </p>
        </div>
    </div>
    <div
    id="liff-data"
    data-liff-id="{{ liff_id }}"
    data-upload-batch-max-images="{{ upload_batch_max_images }}"
    data-upload-batch-max-bytes="{{ upload_batch_max_bytes }}"
    data-upload-max-total-bytes="{{ upload_max_total_bytes }}"
    hidden>
    </div>
    <!-- LINE 官方 LIFF SDK -->
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <!-- 再載入自己的 JavaScript -->
    <script src="{{ url_for('static', filename='js/liff.js') }}?v=10"></script>
    
</body>
</html>
