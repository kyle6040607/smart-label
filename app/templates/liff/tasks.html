<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>我的標註任務</title>
    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='favicon.png') }}"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&text=Seer&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/liff.css') }}?v=6"
    >
</head>

<body>
    <main class="container">
        <header class="app-header">
            <a class="app-brand" href="{{ url_for('liff.upload_page') }}">
                <img
                    class="brand-mark"
                    src="{{ url_for('static', filename='favicon.png') }}"
                    alt=""
                    aria-hidden="true"
                >
                <span class="brand-copy">
                    <span class="brand-name">Seer</span>
                    <span class="brand-subtitle">智慧影像標註</span>
                </span>
            </a>
            <a class="header-link" href="{{ url_for('liff.upload_page') }}">
                建立任務
            </a>
        </header>

        <section class="card">
            <div class="task-overview">
                <div class="page-heading">
                    <span class="eyebrow">任務中心</span>
                    <h1>我的標註任務</h1>
                    <p class="page-description">
                        查看處理進度、下載標註結果或追加新的圖片。
                    </p>
                </div>

                <button
                    id="refresh-button"
                    class="submit-button button-secondary"
                    type="button"
                    hidden
                >
                    重新整理
                </button>
            </div>

            <div id="status" class="status">
                登入中......
            </div>
        </section>

        <section
            id="active-section"
            class="card task-section"
            hidden
        >
            <div class="task-section-heading">
                <h2>進行中的任務</h2>
            </div>
            <div id="active-tasks"></div>
        </section>

        <section
            id="history-section"
            class="card task-section"
            hidden
        >
            <div class="task-section-heading">
                <h2>歷史紀錄</h2>
            </div>
            <div id="history-tasks"></div>
        </section>

        <section
            id="empty-section"
            class="card task-section"
            hidden
        >
            <div class="empty-state">
                <div class="empty-state-icon" aria-hidden="true">＋</div>
                <h2>還沒有標註任務</h2>
                <p>上傳圖片後，任務進度會顯示在這裡。</p>
                <a class="submit-button" href="{{ url_for('liff.upload_page') }}">
                    建立第一個任務
                </a>
            </div>
        </section>
    </main>

    <template id="task-card-template">
        <article class="task-card">
            <div class="task-card-header">
                <h3 class="task-prompt"></h3>
                <span class="task-status"></span>
            </div>

            <p class="task-info"></p>
            <p class="task-error" hidden></p>

            <div class="task-actions">
                <a
                    class="download-button task-download"
                    href=""
                    hidden
                >
                    下載 ZIP
                </a>

                <button
                    class="submit-button task-add-images"
                    type="button"
                    hidden
                >
                    新增照片
                </button>

                <button
                    class="submit-button task-excluded-toggle"
                    type="button"
                    hidden
                >
                    查看未通過圖片
                </button>
            </div>

            <div class="task-excluded-panel" hidden>
                <div class="task-excluded-list"></div>
                <button
                    class="submit-button task-excluded-more"
                    type="button"
                    hidden
                >
                    載入更多
                </button>
            </div>
        </article>
    </template>

    <div
        id="liff-data"
        data-liff-id="{{ liff_id }}"
        hidden
    ></div>

    <script
        charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>
    <script
        src="{{ url_for('static', filename='js/liff_tasks.js') }}?v=6"
    ></script>
</body>
</html>
